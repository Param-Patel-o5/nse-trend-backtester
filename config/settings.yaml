universe:
  name: "Nifty500"
  csv_url: "https://archives.nseindia.com/content/indices/ind_nifty500list.csv"
  fallback_csv: "data/ind_nifty500list.csv"
  symbol_suffix: ".NS"
  # Default limit on symbols (null means full universe)
  limit: null

signal:
  fast_sma: 30
  slow_sma: 50
  interval: "1wk"
  min_bars: 55

backtest:
  years: 3
  horizons: [5, 10, 20]
  output_events_csv: "data/backtest_events.csv"
  output_summary_csv: "data/backtest_summary.csv"

scan:
  output_csv: "data/golden_cross_alerts.csv"

cache:
  enabled: true
  cache_dir: "data/cache"
  max_cache_age_days: 3

